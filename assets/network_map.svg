<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      .node-label { font-family: 'Segoe UI', 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #111317; text-anchor: middle; letter-spacing: 0.5px; }
      .node-sub   { font-family: 'Space Mono', 'Consolas', monospace; font-size: 8.5px; fill: #A81B1E; text-anchor: middle; font-weight: 600; }
      .node-year  { font-family: 'Space Mono', 'Consolas', monospace; font-size: 8px; fill: #64748B; text-anchor: middle; }
      .route      { fill: none; stroke: #CBD5E1; stroke-width: 1.5; }

      @keyframes pulseNode1 {
        0%       { stroke: #CBD5E1; stroke-width: 1.2px; }
        5%       { stroke: #A81B1E; stroke-width: 2.2px; }
        15%      { stroke: #CBD5E1; stroke-width: 1.2px; }
        100%     { stroke: #CBD5E1; stroke-width: 1.2px; }
      }
      @keyframes pulseNode2 {
        0%, 30%  { stroke: #CBD5E1; stroke-width: 1.2px; }
        38%      { stroke: #A81B1E; stroke-width: 2.2px; }
        48%      { stroke: #CBD5E1; stroke-width: 1.2px; }
        100%     { stroke: #CBD5E1; stroke-width: 1.2px; }
      }
      @keyframes pulseNode3 {
        0%, 63%  { stroke: #CBD5E1; stroke-width: 1.2px; }
        71%      { stroke: #A81B1E; stroke-width: 2.2px; }
        81%      { stroke: #CBD5E1; stroke-width: 1.2px; }
        100%     { stroke: #CBD5E1; stroke-width: 1.2px; }
      }
      @keyframes pulseNode4 {
        0%, 95%  { stroke: #CBD5E1; stroke-width: 1.5px; }
        98%      { stroke: #A81B1E; stroke-width: 2.5px; }
        100%     { stroke: #A81B1E; stroke-width: 1.5px; }
      }
      .pulse-node-1 { animation: pulseNode1 3s ease-in-out infinite; }
      .pulse-node-2 { animation: pulseNode2 3s ease-in-out infinite; }
      .pulse-node-3 { animation: pulseNode3 3s ease-in-out infinite; }
      .pulse-node-4 { animation: pulseNode4 3s ease-in-out infinite; }
    </style>

    <!-- Arrow marker in Arasaka Red -->
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#A81B1E" opacity="0.9"/>
    </marker>
  </defs>

  <!-- W3C Dublin Core Provenance Metadata -->
  <metadata id="provenance-metadata">
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:cc="http://creativecommons.org/ns#">
      <rdf:Description rdf:about="https://github.com/VictorRamosHC">
        <dc:title>Victor Ramos HC // Systems Topology &amp; Routing Map</dc:title>
        <dc:creator>Victor &quot;Hugh&quot; Ramos</dc:creator>
        <dc:identifier>https://github.com/VictorRamosHC/VictorRamosHC</dc:identifier>
        <dc:rights>Copyright (c) 2026 Victor Hugo Ramos. All rights reserved. Sovereign Infrastructure.</dc:rights>
        <dc:description>Evolutionary routing topology traversing ProjetoViagem, GlassTask, Prisma House Painter, and Aether Vault</dc:description>
        <dc:date>2026-10-28</dc:date>
        <dc:format>image/svg+xml</dc:format>
        <cc:license rdf:resource="https://github.com/VictorRamosHC/VictorRamosHC/blob/main/LICENSE"/>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <!-- Background: Porcelain White -->
  <rect width="900" height="160" fill="#F8F9FA"/>
  <rect x="0.5" y="0.5" width="899" height="159" fill="none" stroke="#E2E5EB" stroke-width="1"/>

  <!-- Top and bottom borders -->
  <line x1="0" y1="24"  x2="900" y2="24"  stroke="#E2E5EB" stroke-width="0.8"/>
  <line x1="0" y1="136" x2="900" y2="136" stroke="#E2E5EB" stroke-width="0.8"/>

  <text x="24" y="16" font-family="'Segoe UI', 'Inter', sans-serif" font-size="9" fill="#A81B1E" font-weight="700" letter-spacing="2">INFRASTRUCTURE EVOLUTION ROUTE // 経路トポロジー</text>
  <text x="730" y="16" font-family="'Space Mono', monospace" font-size="8.5" fill="#64748B" letter-spacing="1">DETERMINISTIC PROGRESSION</text>

  <!-- ── CONNECTING ROUTE LINES ── -->
  <line x1="140" y1="80" x2="230" y2="80" class="route" marker-end="url(#arr)"/>
  <line x1="340" y1="80" x2="430" y2="80" class="route" marker-end="url(#arr)"/>
  <line x1="570" y1="80" x2="660" y2="80" class="route" marker-end="url(#arr)"/>

  <!-- ── ANIMATED SIGNAL DOTS ── -->
  <!-- Segment 1: Node 1 -> Node 2 -->
  <circle cx="0" cy="0" r="3.5" fill="#A81B1E" opacity="0">
    <animateMotion path="M 140 80 H 230" dur="3s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.333;1"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.333;1" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- Segment 2: Node 2 -> Node 3 -->
  <circle cx="0" cy="0" r="3.5" fill="#A81B1E" opacity="0">
    <animateMotion path="M 340 80 H 430" dur="3s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.333;1"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.333;1" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Segment 3: Node 3 -> Node 4 -->
  <circle cx="0" cy="0" r="3.5" fill="#A81B1E" opacity="0">
    <animateMotion path="M 570 80 H 660" dur="3s" begin="2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.333;1"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.333;1" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ── NODE 1: ProjetoViagem ── -->
  <rect id="node-rect-1" x="30" y="58" width="110" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="2" class="pulse-node-1"/>
  <text x="85" y="76" class="node-label">ProjetoViagem</text>
  <text x="85" y="90" class="node-sub">FOUNDATIONS</text>
  <text x="85" y="116" class="node-year">2024 · WEB CORE</text>

  <!-- ── NODE 2: GlassTask ── -->
  <rect id="node-rect-2" x="230" y="58" width="110" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="2" class="pulse-node-2"/>
  <text x="285" y="76" class="node-label">GlassTask</text>
  <text x="285" y="90" class="node-sub">ERGONOMICS</text>
  <text x="285" y="116" class="node-year">2025 · REAL-TIME</text>

  <!-- ── NODE 3: Prisma House Painter ── -->
  <rect id="node-rect-3" x="430" y="58" width="140" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="2" class="pulse-node-3"/>
  <text x="500" y="76" class="node-label">Prisma House Painter</text>
  <text x="500" y="90" class="node-sub">DESIGN SYSTEM</text>
  <text x="500" y="116" class="node-year">2025 · NEXT.JS</text>

  <!-- ── NODE 4: Aether Vault ── -->
  <rect id="node-rect-4" x="660" y="58" width="130" height="44" fill="#FFFFFF" stroke="#A81B1E" stroke-width="1.5" rx="2" class="pulse-node-4"/>
  <text x="725" y="76" class="node-label">Aether Vault</text>
  <text x="725" y="90" class="node-sub">SOVEREIGN AUDIO</text>
  <text x="725" y="116" class="node-year">2026 · KOTLIN DSP</text>

  <!-- Bottom status line -->
  <text x="24" y="150" font-family="'Space Mono', monospace" font-size="8" fill="#64748B">CONTINUOUS DELIVERY PIPELINE // CANONICAL NODE: VICTOR-HUGH // DEPLOYED</text>
</svg>
