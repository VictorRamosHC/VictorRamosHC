<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      .node-label { font-family: 'Space Mono','Consolas',monospace; font-size: 11px; fill: #E0E7FF; text-anchor: middle; }
      .node-year  { font-family: 'Space Mono','Consolas',monospace; font-size: 8px;  fill: #64748B; text-anchor: middle; }
      .route      { fill: none; stroke: #D4AF37; stroke-width: 1.2; }

      @keyframes signal1 { 0%{offset-distance:0%;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      @keyframes signal2 { 0%{offset-distance:0%;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      @keyframes signal3 { 0%{offset-distance:0%;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }

      .dot1 { offset-path: path('M 110 80 H 290'); animation: signal1 3s linear 0s infinite; }
      .dot2 { offset-path: path('M 310 80 H 490'); animation: signal2 3s linear 1s infinite; }
      .dot3 { offset-path: path('M 510 80 H 690'); animation: signal3 3s linear 2s infinite; }

      @keyframes nodePulse {
        0%,100% { rx: 6; ry: 6; opacity: 0.7; }
        50%     { rx: 8; ry: 8; opacity: 1; }
      }
    </style>

    <!-- Arrow marker -->
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D4AF37" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="#030305"/>
  <!-- Top/bottom border lines -->
  <line x1="0" y1="0"   x2="900" y2="0"   stroke="#1E293B" stroke-width="0.8"/>
  <line x1="0" y1="159" x2="900" y2="159" stroke="#1E293B" stroke-width="0.8"/>

  <!-- ── CONNECTING ROUTE LINES ── -->
  <line x1="110" y1="80" x2="290" y2="80" class="route" marker-end="url(#arr)"/>
  <line x1="310" y1="80" x2="490" y2="80" class="route" marker-end="url(#arr)"/>
  <line x1="510" y1="80" x2="690" y2="80" class="route" marker-end="url(#arr)"/>

  <!-- ── ANIMATED SIGNAL DOTS ── -->
  <circle class="dot1" cx="0" cy="0" r="4" fill="#8C1D18"/>
  <circle class="dot2" cx="0" cy="0" r="4" fill="#8C1D18"/>
  <circle class="dot3" cx="0" cy="0" r="4" fill="#8C1D18"/>

  <!-- ── NODE 1: ProjetoViagem ── -->
  <rect x="30" y="60" width="80" height="40" fill="#0A0B10" stroke="#D4AF37" stroke-width="1"/>
  <text x="70" y="78"  class="node-label">ProjetoViagem</text>
  <text x="70" y="92"  class="node-year">2025</text>

  <!-- ── NODE 2: GlassTask ── -->
  <rect x="210" y="60" width="100" height="40" fill="#0A0B10" stroke="#D4AF37" stroke-width="1"/>
  <text x="260" y="78"  class="node-label">GlassTask</text>
  <text x="260" y="92"  class="node-year">2026·Q1</text>

  <!-- ── NODE 3: Prisma ── -->
  <rect x="410" y="60" width="100" height="40" fill="#0A0B10" stroke="#D4AF37" stroke-width="1"/>
  <text x="460" y="76"  class="node-label">Prisma House</text>
  <text x="460" y="89"  class="node-label">Painter</text>
  <text x="460" y="101" class="node-year">2026·Q2</text>

  <!-- ── NODE 4: Aether Vault ── -->
  <rect x="610" y="55" width="110" height="50" fill="#0A0B10" stroke="#8C1D18" stroke-width="1.5"/>
  <text x="665" y="76"  class="node-label" font-weight="bold">Aether Vault</text>
  <text x="665" y="89"  class="node-label" font-size="9" fill="#D4AF37">Sovereign Audio</text>
  <text x="665" y="102" class="node-year">2026·Q4 ★</text>

  <!-- ── SECTION LABEL ── -->
  <text x="450" y="140" font-family="'Space Mono',monospace" font-size="8" fill="#64748B" text-anchor="middle" letter-spacing="3">SIGNAL ROUTE // ARCHITECTURE EVOLUTION TIMELINE</text>
</svg>
