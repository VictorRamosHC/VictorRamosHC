<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      .node-label { font-family: 'Space Mono', 'Consolas', monospace; font-size: 10.5px; fill: #E0E7FF; text-anchor: middle; }
      .node-sub   { font-family: 'Space Mono', 'Consolas', monospace; font-size: 8.5px; fill: #D4AF37; text-anchor: middle; }
      .node-year  { font-family: 'Space Mono', 'Consolas', monospace; font-size: 8px; fill: #64748B; text-anchor: middle; }
      .route      { fill: none; stroke: #D4AF37; stroke-width: 1.2; }

      @keyframes pulseNode1 {
        0%       { stroke: #D4AF37; stroke-width: 1.2px; }
        5%       { stroke: #F5F0E8; stroke-width: 2.4px; }
        15%      { stroke: #D4AF37; stroke-width: 1.2px; }
        100%     { stroke: #D4AF37; stroke-width: 1.2px; }
      }
      @keyframes pulseNode2 {
        0%, 30%  { stroke: #D4AF37; stroke-width: 1.2px; }
        38%      { stroke: #F5F0E8; stroke-width: 2.4px; }
        48%      { stroke: #D4AF37; stroke-width: 1.2px; }
        100%     { stroke: #D4AF37; stroke-width: 1.2px; }
      }
      @keyframes pulseNode3 {
        0%, 63%  { stroke: #D4AF37; stroke-width: 1.2px; }
        71%      { stroke: #F5F0E8; stroke-width: 2.4px; }
        81%      { stroke: #D4AF37; stroke-width: 1.2px; }
        100%     { stroke: #D4AF37; stroke-width: 1.2px; }
      }
      @keyframes pulseNode4 {
        0%, 95%  { stroke: #D4AF37; stroke-width: 1.5px; }
        98%      { stroke: #F5F0E8; stroke-width: 3.0px; }
        100%     { stroke: #8C1D18; stroke-width: 2.0px; }
      }
      .pulse-node-1 { animation: pulseNode1 3s ease-in-out infinite; }
      .pulse-node-2 { animation: pulseNode2 3s ease-in-out infinite; }
      .pulse-node-3 { animation: pulseNode3 3s ease-in-out infinite; }
      .pulse-node-4 { animation: pulseNode4 3s ease-in-out infinite; }
    </style>

    <!-- Arrow marker -->
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D4AF37" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Dublin Core Provenance Metadata -->
  <metadata id="provenance-metadata">
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:cc="http://creativecommons.org/ns#">
      <rdf:Description rdf:about="https://github.com/VictorRamosHC">
        <dc:title>Victor Ramos HC // Systems Topology &amp; Routing Map</dc:title>
        <dc:creator>Victor "Hugh" Ramos</dc:creator>
        <dc:identifier>https://github.com/VictorRamosHC/VictorRamosHC</dc:identifier>
        <dc:rights>Copyright (c) 2026 Victor Hugo Ramos. All rights reserved. Sovereign Infrastructure.</dc:rights>
        <dc:description>Evolutionary routing topology traversing ProjetoViagem, GlassTask, Prisma House Painter, and Aether Vault</dc:description>
        <dc:date>2026-10-28</dc:date>
        <dc:format>image/svg+xml</dc:format>
        <cc:license rdf:resource="https://github.com/VictorRamosHC/VictorRamosHC/blob/main/LICENSE"/>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <!-- Background -->
  <rect width="900" height="160" fill="#030305"/>

  <!-- Top and bottom border lines -->
  <line x1="0" y1="0"   x2="900" y2="0"   stroke="#1E293B" stroke-width="0.8"/>
  <line x1="0" y1="159" x2="900" y2="159" stroke="#1E293B" stroke-width="0.8"/>

  <!-- ── CONNECTING ROUTE LINES ── -->
  <line x1="130" y1="81" x2="230" y2="81" class="route" marker-end="url(#arr)"/>
  <line x1="330" y1="81" x2="430" y2="81" class="route" marker-end="url(#arr)"/>
  <line x1="560" y1="81" x2="660" y2="81" class="route" marker-end="url(#arr)"/>

  <!-- ── ANIMATED SIGNAL DOTS (0s -> 1s -> 2s -> 3s) ── -->
  <!-- Segment 1: Node 1 -> Node 2 (travels 0s -> 1s) -->
  <circle cx="0" cy="0" r="3.5" fill="#8C1D18" opacity="0">
    <animateMotion path="M 130 81 H 230" dur="3s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.333;1"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.333;1" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- Segment 2: Node 2 -> Node 3 (travels 1s -> 2s) -->
  <circle cx="0" cy="0" r="3.5" fill="#8C1D18" opacity="0">
    <animateMotion path="M 330 81 H 430" dur="3s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.333;1"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.333;1" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Segment 3: Node 3 -> Node 4 (travels 2s -> 3s) -->
  <circle cx="0" cy="0" r="3.5" fill="#8C1D18" opacity="0">
    <animateMotion path="M 560 81 H 660" dur="3s" begin="2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.333;1"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.333;1" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ── NODE 1: ProjetoViagem (pulse at 0s) ── -->
  <!-- Synchronized reactive glow halo -->
  <rect x="28" y="58" width="104" height="46" rx="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.1;0.25" dur="3s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect id="node-rect-1" x="30" y="60" width="100" height="42" fill="#0A0B10" stroke="#D4AF37" stroke-width="1.2" rx="2" class="node-box pulse-node-1">
    <animate attributeName="stroke" values="#D4AF37;#F5F0E8;#D4AF37" keyTimes="0;0.1;0.25" dur="3s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.2;2.4;1.2" keyTimes="0;0.1;0.25" dur="3s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="80" y="78" class="node-label">ProjetoViagem</text>
  <text x="80" y="93" class="node-year">2024</text>

  <!-- ── NODE 2: GlassTask (arrival pulse at 1s) ── -->
  <!-- Synchronized reactive glow halo -->
  <rect x="228" y="58" width="104" height="46" rx="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.1;0.25" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <rect id="node-rect-2" x="230" y="60" width="100" height="42" fill="#0A0B10" stroke="#D4AF37" stroke-width="1.2" rx="2" class="node-box pulse-node-2">
    <animate attributeName="stroke" values="#D4AF37;#F5F0E8;#D4AF37" keyTimes="0;0.1;0.25" dur="3s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.2;2.4;1.2" keyTimes="0;0.1;0.25" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="280" y="78" class="node-label">GlassTask</text>
  <text x="280" y="93" class="node-year">2026·Q1</text>

  <!-- ── NODE 3: Prisma House Painter (arrival pulse at 2s) ── -->
  <!-- Synchronized reactive glow halo -->
  <rect x="428" y="58" width="134" height="46" rx="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.1;0.25" dur="3s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <rect id="node-rect-3" x="430" y="60" width="130" height="42" fill="#0A0B10" stroke="#D4AF37" stroke-width="1.2" rx="2" class="node-box pulse-node-3">
    <animate attributeName="stroke" values="#D4AF37;#F5F0E8;#D4AF37" keyTimes="0;0.1;0.25" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.2;2.4;1.2" keyTimes="0;0.1;0.25" dur="3s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <text x="495" y="78" class="node-label">Prisma House Painter</text>
  <text x="495" y="93" class="node-year">2026·Q2</text>

  <!-- ── NODE 4: Aether Vault (arrival pulse at 3s) ── -->
  <rect id="node-rect-4" x="660" y="56" width="120" height="50" fill="#0A0B10" stroke="#D4AF37" stroke-width="1.5" rx="2" class="node-box pulse-node-4">
    <animate attributeName="stroke" values="#D4AF37;#F5F0E8;#8C1D18;#D4AF37" keyTimes="0;0.1;0.2;0.3" dur="3s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;3.0;2.0;1.5" keyTimes="0;0.1;0.2;0.3" dur="3s" begin="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Synchronized reactive glow halo -->
  <rect x="658" y="54" width="124" height="54" rx="4" fill="none" stroke="#D4AF37" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.1;0.3" dur="3s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#D4AF37;#F5F0E8;#8C1D18;#D4AF37" keyTimes="0;0.1;0.2;0.3" dur="3s" begin="3s" repeatCount="indefinite"/>
  </rect>
  <text x="720" y="77" class="node-label" font-weight="bold">Aether Vault</text>
  <text x="720" y="89" class="node-sub">Sovereign Audio</text>
  <text x="720" y="100" class="node-year">2026·Q4 ★</text>

  <!-- ── SECTION LABEL ── -->
  <text x="450" y="142" font-family="'Space Mono', 'Consolas', monospace" font-size="8" fill="#64748B" text-anchor="middle" letter-spacing="3">SIGNAL ROUTE // ARCHITECTURE EVOLUTION TIMELINE</text>
</svg>
