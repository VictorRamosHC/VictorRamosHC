<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF003C"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0)"/>
      <stop offset="50%" stop-color="rgba(0, 229, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0)"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes typing {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scan {
      0% { transform: translateY(-280px); }
      100% { transform: translateY(280px); }
    }
    @keyframes waveMove {
      0% { d: path("M 460 215 Q 490 200 520 215 T 580 215 T 640 215 T 700 215 T 760 215"); }
      50% { d: path("M 460 215 Q 490 230 520 215 T 580 215 T 640 215 T 700 215 T 760 215"); }
      100% { d: path("M 460 215 Q 490 200 520 215 T 580 215 T 640 215 T 700 215 T 760 215"); }
    }
    @keyframes hexPulse {
      0%, 100% { fill: #00E5FF; }
      50% { fill: #FF003C; }
    }
    .term-text {
      font-family: 'Space Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      fill: #E0E7FF;
    }
    .code-green { fill: #00FF66; }
    .code-cyan { fill: #00E5FF; }
    .code-red { fill: #FF003C; }
    .code-gold { fill: #D4AF37; }
    .code-dim { fill: #64748B; }
    .cursor {
      animation: blink 0.9s infinite;
      fill: #00E5FF;
    }
    .scanline {
      animation: scan 4s linear infinite;
    }
    .wave-anim {
      animation: waveMove 2s ease-in-out infinite;
    }
    .hex-highlight {
      animation: hexPulse 3s infinite;
    }
  </style>

  <!-- Terminal Frame -->
  <rect x="2" y="2" width="846" height="276" rx="6" fill="#030305" stroke="url(#cyberBorder)" stroke-width="1.5"/>

  <!-- Top Bar / HUD Header -->
  <rect x="2" y="2" width="846" height="34" rx="6" fill="#0A0B10"/>
  <line x1="2" y1="36" x2="848" y2="36" stroke="#1E293B" stroke-width="1"/>

  <!-- Terminal Controls -->
  <circle cx="22" cy="19" r="5" fill="#FF003C"/>
  <circle cx="38" cy="19" r="5" fill="#D4AF37"/>
  <circle cx="54" cy="19" r="5" fill="#00E5FF"/>

  <!-- Header Title -->
  <text x="75" y="24" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" fill="#94A3B8">
    ARASAKA_NET // ICE-BREAKER CONSOLE v2.0.77 — SESSION: <tspan fill="#00E5FF">AUTHENTICATED</tspan>
  </text>
  <text x="730" y="24" font-family="'Space Mono', monospace" font-size="11" fill="#FF003C">
    [ENC: RSA-2048]
  </text>

  <!-- Left Column: Terminal Output -->
  <g transform="translate(20, 65)">
    <text x="0" y="0" class="term-text code-dim">> CONNECTING TO NODE [aether-vault.infra.core]...</text>
    <text x="0" y="22" class="term-text code-green">✓ BYPASS_DAEMON: ICE BREACH SUCCESSFUL [LATENCY: 0.8ms]</text>
    <text x="0" y="44" class="term-text">> INTRUSION_VECTOR: <tspan class="code-cyan">Media3_DSP_Kernel_v1.5.0</tspan></text>
    <text x="0" y="66" class="term-text">> DEPLOYED_AGENTS: <tspan class="code-gold">6 Autonomous Cores</tspan> [CONCURRENCY: 0 DEADLOCKS]</text>
    <text x="0" y="88" class="term-text code-red">! SECURITY_STATUS: AIR-GAPPED // EXPLOIT MITIGATION VERIFIED</text>
    <text x="0" y="110" class="term-text">> OPERATOR: <tspan class="code-cyan" font-weight="bold">Victor "Hugh" Ramos</tspan> [CHIEF_ORCHESTRATOR]</text>
    <text x="0" y="132" class="term-text code-green">> PROMPT: <tspan fill="#E0E7FF">execute --target=production --mode=sovereign</tspan><rect x="425" y="120" width="8" height="15" class="cursor"/></text>
  </g>

  <!-- Vertical Divider -->
  <line x1="510" y1="46" x2="510" y2="265" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Right Column: Netrunner Memory Buffer & Oscilloscope HUD -->
  <g transform="translate(530, 65)">
    <text x="0" y="0" class="term-text code-cyan" font-size="11" font-weight="bold">[ BUFFER MATRIX // BREACH PROTOCOL ]</text>

    <!-- Hex Matrix Dump -->
    <text x="0" y="24" class="term-text code-dim" font-size="12">
      <tspan class="hex-highlight">1C</tspan>  BD  55  7A  E9  FF
    </text>
    <text x="0" y="44" class="term-text code-dim" font-size="12">
      55  <tspan class="code-green">1C</tspan>  1C  E9  BD  7A
    </text>
    <text x="0" y="64" class="term-text code-dim" font-size="12">
      BD  7A  <tspan class="code-gold">55</tspan>  BD  1C  55
    </text>
    <text x="0" y="84" class="term-text code-dim" font-size="12">
      E9  BD  55  <tspan class="code-cyan">7A</tspan>  1C  E9
    </text>

    <!-- Sub-buffer Status -->
    <text x="0" y="110" class="term-text code-dim" font-size="11">TARGET SEQUENCE: <tspan class="code-cyan">[ 1C ]</tspan> <tspan class="code-green">[ 55 ]</tspan> <tspan class="code-gold">[ 7A ]</tspan></text>

    <!-- Oscilloscope telemetry line -->
    <path class="wave-anim" d="M 0 135 Q 35 125 70 135 T 140 135 T 210 135 T 280 135" fill="none" stroke="#00E5FF" stroke-width="1.8" filter="url(#neonGlow)"/>
    <text x="210" y="150" class="term-text code-dim" font-size="10">DSP_TELEMETRY: 48kHz</text>
  </g>

  <!-- Scanline Overlay -->
  <rect x="2" y="36" width="846" height="40" fill="url(#scanlineGrad)" class="scanline" pointer-events="none"/>
</svg>