  <circle cx="34" cy="189" r="3" fill="#8C1D18"/>
  <text x="44" y="192" class="mono-val" font-weight="bold">OP. CASSINO REVERSO</text>
  <text x="250" y="192" class="mono-green">[ONLINE]</text>
  <text x="44" y="204" class="mono-sub">Next.js · Probabilistic Logic · Monte Carlo EV</text>

  <!-- Node 05: ProjetoViagem -->
  <circle cx="34" cy="226" r="3" fill="#64748B"/>
