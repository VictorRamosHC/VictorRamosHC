  <rect x="345" y="38" width="295" height="22" fill="#030305"/>
  <line x1="345" y1="60" x2="640" y2="60" stroke="#1E293B" stroke-width="0.8"/>
  <text x="355" y="53" class="mono-header" font-size="9.5">02 // DETERMINISTIC PIPELINE METRICS</text>

  <!-- Metric Badges -->
  <text x="355" y="80" class="mono-sub">AUTOMATED SUITE ASSERTIONS:</text>
  <text x="560" y="80" class="mono-val" font-weight="bold">63 / 63 PASS</text>
  <rect x="355" y="86" width="275" height="4" fill="#030305"/>
  <rect x="355" y="86" width="275" height="4" fill="#D4AF37"/>

  <text x="355" y="108" class="mono-sub">CODEBASE AUTONOMY / OFFLINE:</text>
  <text x="585" y="108" class="mono-val" font-weight="bold">100.0%</text>
  <rect x="355" y="114" width="275" height="4" fill="#030305"/>
  <rect x="355" y="114" width="275" height="4" fill="#D4AF37"/>

