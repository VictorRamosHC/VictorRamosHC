    <circle cx="0" cy="0" r="36" fill="#FFFFFF" stroke="#111317" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="33" fill="none" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="1, 2"/>
