<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      .mono-header { font-family: 'Segoe UI', 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #111317; letter-spacing: 2px; font-weight: 700; }
      .mono-sub    { font-family: 'Space Mono', 'Consolas', monospace; font-size: 9px;  fill: #64748B; letter-spacing: 1px; }
      .mono-val    { font-family: 'Space Mono', 'Consolas', monospace; font-size: 10px; fill: #111317; letter-spacing: 1px; font-weight: 600; }
      .mono-red    { font-family: 'Space Mono', 'Consolas', monospace; font-size: 9px;  fill: #A81B1E; font-weight: 700; }
      .mono-jp     { font-family: 'Segoe UI', 'Inter', 'Noto Sans JP', sans-serif; font-size: 10px; fill: #94181B; }

      @keyframes pulseLine {
        0%, 100% { stroke-dashoffset: 200; opacity: 0.5; }
        50%      { stroke-dashoffset: 0;   opacity: 1; }
      }
      @keyframes barBlink {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 0.45; }
      }

      .pulse-path {
        stroke-dasharray: 200;
        animation: pulseLine 6s ease-in-out infinite;
      }
      .telemetry-bar {
        animation: barBlink 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- W3C Dublin Core RDF Metadata -->
  <metadata id="console-provenance-metadata">
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:cc="http://creativecommons.org/ns#">
      <rdf:Description rdf:about="https://github.com/VictorRamosHC">
        <dc:title>Archivum Victoris // Sovereign Telemetry &amp; Systems Console</dc:title>
        <dc:creator>Victor &quot;Hugh&quot; Ramos</dc:creator>
        <dc:identifier>https://github.com/VictorRamosHC/VictorRamosHC</dc:identifier>
        <dc:rights>Copyright (c) 2026 Victor Hugo Ramos. All rights reserved. Sovereign Infrastructure.</dc:rights>
        <dc:description>Bespoke SVG Architectural Telemetry Console replacing third-party GitHub stats.</dc:description>
        <dc:date>2026-10-28</dc:date>
        <dc:format>image/svg+xml</dc:format>
        <cc:license rdf:resource="https://github.com/VictorRamosHC/VictorRamosHC/blob/main/LICENSE"/>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

