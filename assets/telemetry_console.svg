<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      .mono-header { font-family: 'Space Mono', 'Consolas', monospace; font-size: 11px; fill: #D4AF37; letter-spacing: 2px; font-weight: bold; }
      .mono-sub    { font-family: 'Space Mono', 'Consolas', monospace; font-size: 9px;  fill: #64748B; letter-spacing: 1px; }
      .mono-val    { font-family: 'Space Mono', 'Consolas', monospace; font-size: 10px; fill: #F5F0E8; letter-spacing: 1px; }
      .mono-green  { font-family: 'Space Mono', 'Consolas', monospace; font-size: 9px;  fill: #D4AF37; font-weight: bold; }
      .mono-alert  { font-family: 'Space Mono', 'Consolas', monospace; font-size: 9px;  fill: #8C1D18; font-weight: bold; }

      @keyframes pulseLine {
        0%, 100% { stroke-dashoffset: 200; opacity: 0.4; }
        50%      { stroke-dashoffset: 0;   opacity: 1; }
      }
      @keyframes radarSweep {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes barBlink {
        0%, 100% { opacity: 0.8; }
        50%      { opacity: 0.3; }
      }

      .pulse-path {
        stroke-dasharray: 200;
        animation: pulseLine 6s ease-in-out infinite;
      }
      .telemetry-bar {
        animation: barBlink 4s ease-in-out infinite;
      }
    </style>

    <!-- Scanline pattern -->
    <pattern id="console-scanlines" x="0" y="0" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="#F5F0E8" opacity="0.02"/>
    </pattern>
  </defs>

  <!-- W3C Dublin Core RDF Metadata -->
  <metadata id="console-provenance-metadata">
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:cc="http://creativecommons.org/ns#">
      <rdf:Description rdf:about="https://github.com/VictorRamosHC">
        <dc:title>Archivum Victoris // Sovereign Telemetry &amp; Systems Console</dc:title>
        <dc:creator>Victor "Hugh" Ramos</dc:creator>
        <dc:identifier>https://github.com/VictorRamosHC/VictorRamosHC</dc:identifier>
        <dc:rights>Copyright (c) 2026 Victor Hugo Ramos. All rights reserved. Sovereign Infrastructure.</dc:rights>
        <dc:description>Bespoke SVG Architectural Telemetry Console replacing third-party GitHub stats.</dc:description>
        <dc:date>2026-10-28</dc:date>
        <dc:format>image/svg+xml</dc:format>
        <cc:license rdf:resource="https://github.com/VictorRamosHC/VictorRamosHC/blob/main/LICENSE"/>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <!-- Background Canvas -->
  <rect width="900" height="280" fill="#030305"/>
  <rect x="1" y="1" width="898" height="278" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.8"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="900" height="26" fill="#0A0B10"/>
  <line x1="0" y1="26" x2="900" y2="26" stroke="#1E293B" stroke-width="1"/>
  <text x="14" y="17" class="mono-header">ARCHIVUM VICTORIS // SOVEREIGN TELEMETRY CONSOLE</text>
  <text x="590" y="17" class="mono-sub">SECURITY CLEARANCE: </text>
  <text x="735" y="17" class="mono-green">SOVEREIGN LEVEL-1</text>

  <!-- Corner Brackets -->
  <path d="M 6 36 V 30 H 12" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
  <path d="M 894 36 V 30 H 888" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
  <path d="M 6 244 V 250 H 12" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
  <path d="M 894 244 V 250 H 888" fill="none" stroke="#D4AF37" stroke-width="1.2"/>

  <!-- ── PANEL 1: DEPLOYED SYSTEMS ARCHITECTURE (x: 20 -> 340) ── -->
  <rect x="20" y="38" width="310" height="212" fill="#0A0B10" stroke="#1E293B" stroke-width="0.8"/>
  <rect x="20" y="38" width="310" height="22" fill="#030305"/>
  <line x1="20" y1="60" x2="330" y2="60" stroke="#1E293B" stroke-width="0.8"/>
  <text x="30" y="53" class="mono-header" font-size="9.5">01 // ACTIVE OPERATIONS TELEMETRY</text>

  <!-- Node 01: Aether Vault -->
  <circle cx="34" cy="78" r="3" fill="#D4AF37"/>
  <text x="44" y="81" class="mono-val" font-weight="bold">OP. AETHER VAULT</text>
  <text x="250" y="81" class="mono-green">[ONLINE]</text>
  <text x="44" y="93" class="mono-sub">Media3 ExoPlayer · DSP 5-Band · 100% Offline</text>

  <!-- Node 02: Prisma House Painter -->
  <circle cx="34" cy="115" r="3" fill="#D4AF37"/>
  <text x="44" y="118" class="mono-val" font-weight="bold">OP. PRISMA PAINTER</text>
  <text x="250" y="118" class="mono-green">[ONLINE]</text>
  <text x="44" y="130" class="mono-sub">Next.js · Euclidean RGB Space · Design System</text>

  <!-- Node 03: GlassTask -->
  <circle cx="34" cy="152" r="3" fill="#D4AF37"/>
  <text x="44" y="155" class="mono-val" font-weight="bold">OP. GLASSTASK</text>
  <text x="250" y="155" class="mono-green">[ACTIVE]</text>
  <text x="44" y="167" class="mono-sub">Vanilla JS Engine · CSS Glass · Zero-Dep State</text>

