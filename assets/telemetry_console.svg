  <rect x="355" y="172" width="275" height="66" fill="#030305" stroke="#1E293B" stroke-width="0.5"/>
  
  <!-- Grid Lines inside pulse graph -->
  <line x1="355" y1="194" x2="630" y2="194" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="2, 2"/>
  <line x1="355" y1="216" x2="630" y2="216" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="2, 2"/>
  
  <!-- Activity Bars -->
  <g class="telemetry-bar">
    <rect x="365" y="210" width="8" height="24" fill="#D4AF37" opacity="0.6"/>
    <rect x="378" y="195" width="8" height="39" fill="#D4AF37" opacity="0.8"/>
    <rect x="391" y="202" width="8" height="32" fill="#D4AF37" opacity="0.7"/>
    <rect x="404" y="185" width="8" height="49" fill="#8C1D18" opacity="0.9"/>
    <rect x="417" y="190" width="8" height="44" fill="#D4AF37" opacity="0.8"/>
    <rect x="430" y="205" width="8" height="29" fill="#D4AF37" opacity="0.6"/>
    <rect x="443" y="180" width="8" height="54" fill="#D4AF37" opacity="0.9"/>
    <rect x="456" y="176" width="8" height="58" fill="#8C1D18" opacity="0.9"/>
    <rect x="469" y="188" width="8" height="46" fill="#D4AF37" opacity="0.8"/>
    <rect x="482" y="196" width="8" height="38" fill="#D4AF37" opacity="0.7"/>
    <rect x="495" y="182" width="8" height="52" fill="#D4AF37" opacity="0.9"/>
    <rect x="508" y="175" width="8" height="59" fill="#D4AF37"/>
    <rect x="521" y="188" width="8" height="46" fill="#8C1D18" opacity="0.8"/>
    <rect x="534" y="198" width="8" height="36" fill="#D4AF37" opacity="0.7"/>
    <rect x="547" y="185" width="8" height="49" fill="#D4AF37" opacity="0.85"/>
    <rect x="560" y="178" width="8" height="56" fill="#D4AF37"/>
    <rect x="573" y="192" width="8" height="42" fill="#D4AF37" opacity="0.75"/>
    <rect x="586" y="180" width="8" height="54" fill="#8C1D18" opacity="0.9"/>
    <rect x="599" y="174" width="8" height="60" fill="#D4AF37"/>
    <rect x="612" y="186" width="8" height="48" fill="#D4AF37" opacity="0.8"/>
  </g>

  <!-- Overlay Pulse Line -->
  <path class="pulse-path"
        d="M 365 210 L 378 195 L 391 202 L 404 185 L 417 190 L 430 205 L 443 180 L 456 176 L 469 188 L 482 196 L 495 182 L 508 175 L 521 188 L 534 198 L 547 185 L 560 178 L 573 192 L 586 180 L 599 174 L 612 186"
        fill="none" stroke="#F5F0E8" stroke-width="1.2" opacity="0.9"/>


  <!-- ── PANEL 3: CAESAR MEDALLION & PROVENANCE SEAL (x: 655 -> 880) ── -->
  <rect x="655" y="38" width="225" height="212" fill="#0A0B10" stroke="#1E293B" stroke-width="0.8"/>
  <rect x="655" y="38" width="225" height="22" fill="#030305"/>
  <line x1="655" y1="60" x2="880" y2="60" stroke="#1E293B" stroke-width="0.8"/>
  <text x="665" y="53" class="mono-header" font-size="9.5">03 // PROVENANCE SEAL</text>

  <!-- Caesar Cameo Medallion -->
  <g transform="translate(767, 120)">
    <circle cx="0" cy="0" r="38" fill="#030305" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="1, 2"/>
    <circle cx="0" cy="0" r="31" fill="#0A0B10" stroke="#8C1D18" stroke-width="0.6"/>

    <!-- Caesar Cameo Silhouette -->
    <path d="M -12 18 C -8 15, -2 20, 3 16 C 8 20, 13 16, 16 18 C 15 21, -11 21, -12 18 Z" fill="#D4AF37"/>
    <path d="M -8 17 C -9 12, -10 7, -11 2 C -12 -3, -10 -9, -6 -13 C -2 -16, 3 -17, 8 -15 C 9 -13, 8 -11, 10 -9 C 12 -8, 15 -5, 15 -3 C 13 -2, 10 -1, 10 0 C 12 1, 12 2, 10 3 C 9 4, 11 6, 11 7 C 12 9, 10 11, 8 12 C 6 13, 7 15, 8 17 Z" fill="#F5F0E8"/>
    <path d="M -10 -3 C -9 -10, -4 -15, 4 -15 C 8 -15, 10 -13, 12 -10" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <circle cx="0" cy="-15" r="1.5" fill="#D4AF37"/>
    <circle cx="7" cy="-13" r="1.5" fill="#D4AF37"/>
    <circle cx="-6" cy="-13" r="1.5" fill="#D4AF37"/>
  </g>

  <text x="767" y="178" class="mono-header" font-size="10" text-anchor="middle">VICTOR "HUGH" RAMOS</text>
  <text x="767" y="192" class="mono-sub" text-anchor="middle">CHIEF ARCHITECT</text>
  <text x="767" y="206" class="mono-sub" text-anchor="middle">github.com/VictorRamosHC</text>
  
  <rect x="670" y="216" width="195" height="22" fill="#030305" stroke="#D4AF37" stroke-width="0.6"/>
  <text x="767" y="230" class="mono-green" font-size="8.5" text-anchor="middle">AUTONOMOUS &amp; SOBERANO</text>

  <!-- Bottom HUD bar -->
  <rect x="0" y="258" width="900" height="22" fill="#0A0B10"/>
  <line x1="0" y1="258" x2="900" y2="258" stroke="#1E293B" stroke-width="0.8"/>
  <text x="14" y="272" class="mono-sub">NODE ID: VICTOR-HUGH // FULLSTACK · SECURITY · IA · ANDROID // NO EXTERNAL DEPENDENCY VULNERABILITIES</text>
  <text x="755" y="272" class="mono-sub">SLA UPTIME: 99.98%</text>

  <!-- Scanline overlay -->
