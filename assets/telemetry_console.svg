  <text x="764" y="174" class="mono-header" font-size="10.5" text-anchor="middle">VICTOR &quot;HUGH&quot; RAMOS</text>
  <text x="764" y="188" class="mono-sub" text-anchor="middle">CHIEF SYSTEMS ARCHITECT</text>
