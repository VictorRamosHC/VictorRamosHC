  <rect x="644" y="40" width="240" height="206" fill="#FFFFFF" stroke="#E2E5EB" stroke-width="1" rx="2"/>
  <rect x="644" y="40" width="240" height="24" fill="#F1F3F7"/>
  <line x1="644" y1="64" x2="884" y2="64" stroke="#E2E5EB" stroke-width="1"/>
  <text x="654" y="56" class="mono-header" font-size="9.5">03 // 保安 PROVENANCE SEAL</text>

  <!-- Caesar Cameo Medallion in Corporate Palette -->
