<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Triage // Backlog Control Room</title>
  <style>
    :root { --bg:#030305;--panel:#0A0B10;--amber:#D4AF37;--ivory:#F5F0E8;--crimson:#8C1D18;--muted:#64748B;--text:#E0E7FF;--border:#1E293B; }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Consolas','Space Mono',monospace;}
    body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
    h1{color:var(--amber);font-size:1.4rem;letter-spacing:4px;text-align:center;margin-bottom:4px;}
    .subtitle{color:var(--muted);font-size:0.75rem;letter-spacing:3px;text-align:center;margin-bottom:20px;}
    .game-box{border:1px solid var(--amber);background:var(--panel);padding:20px;max-width:900px;width:100%;}
    .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
    .hud span{font-size:0.8rem;color:var(--muted);}
    .hud strong{color:var(--amber);}
    .timer-bar{height:4px;background:var(--border);margin-bottom:16px;position:relative;overflow:hidden;}
    .timer-fill{height:100%;background:var(--amber);transition:width 0.1s linear;}
    .drop-zone{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
    .col{background:#06070e;border:1px solid var(--border);border-top:2px solid;min-height:140px;padding:8px;}
    .col.critical{border-top-color:#FF3333;}
    .col.high{border-top-color:var(--crimson);}
    .col.medium{border-top-color:var(--amber);}
    .col.low{border-top-color:var(--muted);}
    .col-label{text-align:center;font-size:0.7rem;letter-spacing:2px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
    .col.critical .col-label{color:#FF3333;}
    .col.high .col-label{color:var(--crimson);}
    .col.medium .col-label{color:var(--amber);}
    .col.low .col-label{color:var(--muted);}
    .fall-zone{position:relative;height:80px;overflow:hidden;background:#030408;border:1px solid var(--border);margin-bottom:12px;}
    .task-card{position:absolute;padding:6px 10px;font-size:0.75rem;cursor:pointer;border:1px solid;user-select:none;transition:transform 0.1s;z-index:10;}
    .task-card.critical{border-color:#FF3333;color:#FF3333;background:#1a0505;}
    .task-card.high{border-color:var(--crimson);color:var(--ivory);background:#120405;}
    .task-card.medium{border-color:var(--amber);color:var(--amber);background:#0f0e03;}
    .task-card.low{border-color:var(--muted);color:var(--muted);background:#06090e;}
    .placed-card{padding:4px 8px;font-size:0.7rem;margin-bottom:4px;border-left:2px solid;}
    .placed-card.correct{border-color:#00C060;color:#00C060;background:#020e06;}
    .placed-card.wrong{border-color:var(--crimson);color:var(--crimson);background:#0e0203;opacity:0.7;}
    .btn{background:transparent;border:1px solid var(--amber);color:var(--amber);padding:8px 20px;cursor:pointer;font-family:inherit;font-size:0.85rem;letter-spacing:2px;transition:all 0.2s;margin:4px;}
    .btn:hover{background:var(--amber);color:var(--bg);}
    .btn-crimson{border-color:var(--crimson);color:var(--crimson);}
    .btn-crimson:hover{background:var(--crimson);color:var(--ivory);}
    .screen{text-align:center;padding:40px 20px;}
    .screen h2{color:var(--amber);font-size:1.6rem;letter-spacing:3px;margin-bottom:12px;}
    .screen p{color:var(--muted);font-size:0.85rem;line-height:1.7;margin-bottom:20px;}
    .score-big{font-size:3rem;color:var(--amber);margin:16px 0;}
    .instructions{background:#06070e;border:1px solid var(--border);padding:12px 16px;margin-bottom:20px;font-size:0.8rem;color:var(--muted);line-height:1.7;}
    .instructions strong{color:var(--ivory);}
    .msg{text-align:center;font-size:0.85rem;min-height:22px;color:#00C060;margin-bottom:8px;}
    .round-badge{display:inline-block;padding:2px 8px;border:1px solid var(--amber);color:var(--amber);font-size:0.7rem;margin-left:8px;}
  </style>
</head>
<body>
<div class="game-box" id="app"></div>
<script>
const PRIORITIES = ['critical','high','medium','low'];
const TASK_NAMES = {
  critical:['SYSTEM BREACH DETECTED','AUTH SERVICE DOWN','DB CORRUPTION','PROD BUILD FAILED','API GATEWAY ERROR'],
  high:['MEMORY LEAK IN WORKER','DEPLOY BLOCKED','TEST SUITE FAILING','CORS CONFIG BROKEN','RATE LIMIT HIT'],
  medium:['CACHE INVALIDATION','REFACTOR AUTH MODULE','UPDATE DEPENDENCIES','ADD LOGGING','WRITE UNIT TESTS'],
  low:['UPDATE DOCS','RENAME VARIABLES','FORMAT CODE','ADD COMMENTS','ARCHIVE OLD LOGS']
};

let phase='title', round=0, score=0, timer=30, timerInterval=null;
let fallingCards=[], placed=[];

function app(){return document.getElementById('app');}

function render(){
  if(phase==='title') renderTitle();
  else if(phase==='game') renderGame();
  else if(phase==='roundEnd') renderRoundEnd();
  else if(phase==='end') renderEnd();
}

function renderTitle(){
  app().innerHTML=`<div class="screen">
    <h2>◼ TASK TRIAGE</h2>
    <p style="color:var(--amber);font-size:0.7rem;letter-spacing:3px;margin-bottom:16px">BACKLOG CONTROL ROOM // LINKED TO: GLASSTASK</p>
    <div class="instructions">
      <strong>MISSION:</strong> Cards fall from the top. Click a card, then click the correct priority column to place it.<br>
      <strong>PRIORITIES:</strong> CRITICAL &gt; HIGH &gt; MEDIUM &gt; LOW<br>
      <strong>SCORING:</strong> +10 for correct, -5 for wrong. 3 rounds, 30 seconds each.
    </div>
    <button class="btn" onclick="startGame()">[ OPEN CONTROL ROOM → ]</button></div>`;
}

function startGame(){phase='game';round=1;score=0;startRound();}

function startRound(){
  fallingCards=[];placed=[];
  clearInterval(timerInterval);
  timer=30;
  render();
  spawnCards();
  timerInterval=setInterval(()=>{
    timer=Math.max(0,timer-0.1);
    const fill=document.getElementById('timerFill');
    if(fill) fill.style.width=(timer/30*100)+'%';
    if(timer<=0){clearInterval(timerInterval);endRound();}
  },100);
}

function spawnCards(){
  const spawn=()=>{
    if(phase!=='game') return;
    const pri=PRIORITIES[Math.floor(Math.random()*4)];
    const names=TASK_NAMES[pri];
    const name=names[Math.floor(Math.random()*names.length)];
    const id='c'+Date.now()+Math.random().toString(36).slice(2);
    fallingCards.push({id,priority:pri,name,x:Math.random()*600+20,y:-40,speed:0.8+Math.random()*0.6});
    updateFallZone();
    if(timer>0) setTimeout(spawn,1200+Math.random()*800);
  };
  spawn();
}

function updateFallZone(){
  const fz=document.getElementById('fallZone');
  if(!fz) return;
  fz.innerHTML='';
  fallingCards.forEach(c=>{
    const d=document.createElement('div');
    d.className=`task-card ${c.priority}`;
    d.style.cssText=`left:${c.x}px;top:${c.y}px;`;
    d.textContent=`[${c.priority.toUpperCase()}] ${c.name}`;
    d.onclick=()=>selectCard(c.id);
    fz.appendChild(d);
  });
}

let selectedCard=null;
function selectCard(id){
  selectedCard=id;
  document.querySelectorAll('.task-card').forEach(el=>{
    el.style.outline=el.dataset&&el.dataset.id===id?'2px solid var(--ivory)':'none';
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.style.cursor='pointer';
  });
  const msg=document.getElementById('msg');
  if(msg){const c=fallingCards.find(x=>x.id===id);if(c)msg.textContent=`Selected: [${c.priority.toUpperCase()}] — click a priority column to place it.`;}
}

function placeCard(priority){
  if(!selectedCard) return;
  const idx=fallingCards.findIndex(c=>c.id===selectedCard);
  if(idx===-1){selectedCard=null;return;}
  const c=fallingCards.splice(idx,1)[0];
  const correct=c.priority===priority;
  score+=correct?10:-5;
  placed.push({...c,placedPriority:priority,correct});
  selectedCard=null;
  const msg=document.getElementById('msg');
  if(msg) msg.textContent=correct?'✓ CORRECT CLASSIFICATION':' ✗ WRONG PRIORITY — penalty applied';
  if(msg) msg.style.color=correct?'#00C060':'var(--crimson)';

  // Re-render placed cards and fall zone
  updateFallZone();
  PRIORITIES.forEach(pri=>{
    const col=document.getElementById('col-'+pri);
    if(!col) return;
    const placedHere=placed.filter(p=>p.placedPriority===pri);
    const container=col.querySelector('.placed-container');
    if(container){
      container.innerHTML=placedHere.map(p=>`<div class="placed-card ${p.correct?'correct':'wrong'}">${p.name.substring(0,20)}</div>`).join('');
    }
  });
}

function renderGame(){
  app().innerHTML=`
    <h1>TASK TRIAGE</h1>
    <div class="subtitle">BACKLOG CONTROL ROOM</div>
    <div class="hud">
      <span>ROUND <strong>${round}/3</strong></span>
      <span>SCORE <strong>${score}</strong></span>
      <span>TIME <strong id="timerNum">${Math.ceil(timer)}s</strong></span>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
    <div class="fall-zone" id="fallZone"></div>
    <div class="msg" id="msg">Click a falling card, then click a priority column.</div>
    <div class="drop-zone">
      ${PRIORITIES.map(p=>`
        <div class="col ${p}" id="col-${p}" onclick="placeCard('${p}')">
          <div class="col-label">${p.toUpperCase()}</div>
          <div class="placed-container"></div>
        </div>`).join('')}
    </div>`;

  // Start gravity loop
  let lastT=null;
  const loop=(t)=>{
    if(phase!=='game') return;
    if(lastT){
      const dt=(t-lastT)/16;
      fallingCards.forEach(c=>{c.y+=c.speed*dt;if(c.y>100)c.y=-40;});
      updateFallZone();
    }
    lastT=t;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

function endRound(){
  clearInterval(timerInterval);
  phase='roundEnd';
  render();
}

function renderRoundEnd(){
  const correct=placed.filter(p=>p.correct).length;
  app().innerHTML=`<div class="screen">
    <h2>ROUND ${round} COMPLETE</h2>
    <p>Classified: <strong style="color:var(--amber)">${placed.length}</strong> tasks | Correct: <strong style="color:#00C060">${correct}</strong></p>
    <div class="score-big">${score}</div>
    ${round<3?`<button class="btn" onclick="round++;phase='game';startRound()">[ NEXT ROUND → ]</button>`
             :`<button class="btn" onclick="phase='end';render()">[ VIEW FINAL REPORT ]</button>`}
  </div>`;
}

function renderEnd(){
  const grade=score>=150?'ARCHON':score>=100?'ARCHITECT':score>=50?'ENGINEER':'TRAINEE';
  app().innerHTML=`<div class="screen">
    <h2>◼ TRIAGE COMPLETE</h2>
    <div class="score-big">${score}</div>
    <p>RANK: <strong style="color:var(--amber)">${grade}</strong><br>Your backlog management skills have been logged.<br>GlassTask — where order emerges from chaos.</p>
    <button class="btn" onclick="startGame()">[ RUN AGAIN ]</button>
    <button class="btn btn-crimson" onclick="window.history.back()">[ ← RETURN TO GRID ]</button></div>`;
}

render();
</script>
</body>
</html>
