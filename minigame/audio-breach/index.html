<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Breach // Aether Vault Rhythm Sync</title>
  <style>
    :root{--bg:#030305;--panel:#0A0B10;--amber:#D4AF37;--ivory:#F5F0E8;--crimson:#8C1D18;--muted:#64748B;--text:#E0E7FF;--border:#1E293B;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Consolas','Space Mono',monospace;}
    body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
    h1{color:var(--amber);font-size:1.4rem;letter-spacing:4px;text-align:center;margin-bottom:4px;}
    .subtitle{color:var(--muted);font-size:0.75rem;letter-spacing:3px;text-align:center;margin-bottom:20px;}
    .game-box{border:1px solid var(--amber);background:var(--panel);padding:24px;max-width:700px;width:100%;}
    .hud{display:flex;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);font-size:0.8rem;}
    .hud strong{color:var(--amber);}
    .hud span{color:var(--muted);}
    .waveform{height:60px;background:#060710;border:1px solid var(--border);margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:3px;overflow:hidden;padding:8px;}
    .wave-bar{width:5px;background:var(--amber);border-radius:0;transition:height 0.08s;}
    .status-line{text-align:center;font-size:0.85rem;min-height:28px;color:var(--amber);margin-bottom:16px;letter-spacing:2px;}
    .freq-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
    .freq-btn{padding:20px 8px;background:#060710;border:1px solid var(--border);cursor:pointer;text-align:center;font-family:inherit;font-size:0.75rem;color:var(--muted);transition:all 0.15s;letter-spacing:1px;}
    .freq-btn:hover{border-color:var(--amber);color:var(--amber);}
    .freq-btn.active{background:rgba(212,175,55,0.2);border-color:var(--amber);color:var(--amber);}
    .freq-btn.playing{background:rgba(212,175,55,0.3);border-color:var(--ivory);color:var(--ivory);box-shadow:0 0 10px rgba(212,175,55,0.3);}
    .freq-btn.correct{background:rgba(0,192,96,0.15);border-color:#00C060;color:#00C060;}
    .freq-btn.wrong{background:rgba(140,29,24,0.15);border-color:var(--crimson);color:var(--crimson);}
    .progress-row{display:flex;gap:8px;margin-bottom:12px;}
    .pip{width:12px;height:12px;border:1px solid var(--border);}
    .pip.done{background:var(--amber);}
    .pip.correct{background:#00C060;}
    .pip.wrong{background:var(--crimson);}
    .pip.active{border-color:var(--amber);}
    .btn{background:transparent;border:1px solid var(--amber);color:var(--amber);padding:8px 20px;cursor:pointer;font-family:inherit;font-size:0.85rem;letter-spacing:2px;transition:all 0.2s;margin:4px;}
    .btn:hover{background:var(--amber);color:var(--bg);}
    .btn-crimson{border-color:var(--crimson);color:var(--crimson);}
    .btn-crimson:hover{background:var(--crimson);color:var(--ivory);}
    .screen{text-align:center;padding:40px 20px;}
    .screen h2{color:var(--amber);font-size:1.6rem;letter-spacing:3px;margin-bottom:12px;}
    .screen p{color:var(--muted);font-size:0.85rem;line-height:1.7;margin-bottom:20px;}
    .score-big{font-size:3rem;color:var(--amber);margin:16px 0;}
    .instructions{background:#06070e;border:1px solid var(--border);padding:12px 16px;margin-bottom:20px;font-size:0.8rem;color:var(--muted);line-height:1.7;}
    .instructions strong{color:var(--ivory);}
  </style>
</head>
<body>
<div class="game-box" id="app"></div>
<script>
// Frequency library — 8 distinct, memorable tones
const FREQS = [220, 293.66, 349.23, 440, 523.25, 659.25, 783.99, 987.77];
const FREQ_LABELS = ['A3','D4','F4','A4','C5','E5','G5','B5'];

let audioCtx = null;
let phase = 'title', round = 0, score = 0;
let sequence = [], playerSeq = [], playing = false;
let roundResults = [];

function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, duration=0.4, startTime=0){
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.001, ctx.currentTime + startTime);
  gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + startTime + 0.02);
  gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + startTime + duration - 0.02);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + startTime);
  osc.stop(ctx.currentTime + startTime + duration);
}

function app(){return document.getElementById('app');}

function render(){
  if(phase==='title') renderTitle();
  else if(phase==='game') renderGame();
  else if(phase==='end') renderEnd();
}

function renderTitle(){
  app().innerHTML=`<div class="screen">
    <h2>◼ AUDIO BREACH</h2>
    <p style="color:var(--amber);font-size:0.7rem;letter-spacing:3px;margin-bottom:16px">SIGNAL SYNC ENGINE // LINKED TO: AETHER VAULT</p>
    <div class="instructions">
      <strong>MISSION:</strong> Listen to the tone sequence. Then click the matching frequency buttons in the same order.<br>
      <strong>ROUNDS:</strong> 5 rounds. Sequence length grows each round (3 → 7 tones).<br>
      <strong>SCORING:</strong> 20 points per correct round. Listen carefully — no replays.
    </div>
    <button class="btn" onclick="startGame()">[ ACCESS AETHER VAULT → ]</button></div>`;
}

function startGame(){phase='game';round=0;score=0;roundResults=[];startRound();}

function startRound(){
  const seqLen = 3 + round; // 3,4,5,6,7
  sequence = Array.from({length:seqLen}, ()=>Math.floor(Math.random()*FREQS.length));
  playerSeq = [];
  playing = true;
  render();
  playSequence(() => { playing = false; render(); });
}

function playSequence(callback){
  sequence.forEach((fi, i) => {
    const t = i * 0.6;
    playTone(FREQS[fi], 0.4, t);
    setTimeout(()=>{
      const btns = document.querySelectorAll('.freq-btn');
      btns.forEach(b=>b.classList.remove('playing'));
      const target = document.querySelector(`.freq-btn[data-fi="${fi}"]`);
      if(target) target.classList.add('playing');
      setTimeout(()=>{ if(target) target.classList.remove('playing'); }, 350);
    }, t*1000);
  });
  setTimeout(callback, sequence.length * 600 + 200);
}

function renderGame(){
  const seqLen = 3 + round;
  const wBars = Array.from({length:24},(_,i)=>{
    const h = playing ? Math.round(10+Math.random()*40) : 4;
    return `<div class="wave-bar" style="height:${h}px"></div>`;
  }).join('');

  app().innerHTML=`
    <h1>AUDIO BREACH</h1>
    <div class="subtitle">SIGNAL SYNC ENGINE</div>
    <div class="hud">
      <span>ROUND <strong>${round+1}/5</strong></span>
      <span>SEQUENCE <strong>${seqLen} TONES</strong></span>
      <span>SCORE <strong>${score}</strong></span>
    </div>
    <div class="waveform" id="waveform">${wBars}</div>
    <div class="status-line" id="status">${playing?'▶ PLAYING SEQUENCE — LISTEN...':'◼ YOUR TURN — REPEAT THE SEQUENCE'}</div>
    <div class="freq-grid" id="freqGrid">
      ${FREQS.map((f,i)=>`<button class="freq-btn" data-fi="${i}" onclick="onFreqClick(${i})" ${playing?'disabled':''}>
        <div style="font-size:1rem;margin-bottom:4px">♩</div>
        <div>${FREQ_LABELS[i]}</div>
        <div style="font-size:0.65rem;color:inherit;margin-top:2px">${Math.round(f)}Hz</div>
      </button>`).join('')}
    </div>
    <div class="progress-row">
      ${Array.from({length:seqLen},(_,i)=>`<div class="pip ${i<playerSeq.length?'done':''}"></div>`).join('')}
    </div>`;

  if(playing){
    const animate=()=>{
      const bars=document.querySelectorAll('.wave-bar');
      bars.forEach(b=>b.style.height=Math.round(4+Math.random()*50)+'px');
      if(playing) requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
  }
}

function onFreqClick(fi){
  if(playing) return;
  playTone(FREQS[fi], 0.3);
  // Flash button
  const btn=document.querySelector(`.freq-btn[data-fi="${fi}"]`);
  if(btn){ btn.classList.add('active'); setTimeout(()=>btn.classList.remove('active'),300); }

  playerSeq.push(fi);

  // Check correctness so far
  const pos = playerSeq.length - 1;
  if(playerSeq[pos] !== sequence[pos]){
    // Wrong
    roundResults.push({round:round+1,correct:false,seqLen:3+round});
    const status=document.getElementById('status');
    if(status){status.textContent='✗ WRONG SIGNAL — SEQUENCE FAILED';status.style.color='var(--crimson)';}
    setTimeout(()=>{
      round++;
      if(round<5) startRound();
      else {phase='end';render();}
    },1200);
    return;
  }

  // Update pips
  const pips=document.querySelectorAll('.pip');
  if(pips[pos]) pips[pos].classList.add('done');

  if(playerSeq.length === sequence.length){
    // Correct!
    score += 20;
    roundResults.push({round:round+1,correct:true,seqLen:3+round});
    const status=document.getElementById('status');
    if(status){status.textContent='✓ SEQUENCE SYNCHRONIZED — SIGNAL LOCKED';status.style.color='#00C060';}
    setTimeout(()=>{
      round++;
      if(round<5) startRound();
      else {phase='end';render();}
    },1000);
  }
}

function renderEnd(){
  const correct=roundResults.filter(r=>r.correct).length;
  const grade=score>=100?'SIGNAL_MASTER':score>=60?'FREQUENCY_ENGINEER':score>=40?'RHYTHM_ANALYST':'SIGNAL_TRAINEE';
  app().innerHTML=`<div class="screen">
    <h2>◼ BREACH COMPLETE</h2>
    <div class="score-big">${score}<span style="font-size:1rem;color:var(--muted)">/100</span></div>
    <p>ROUNDS CORRECT: <strong style="color:var(--amber)">${correct}/5</strong> — RANK: <strong style="color:var(--amber)">${grade}</strong></p>
    ${roundResults.map(r=>`<div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:4px">
      <span style="color:var(--muted)">Round ${r.round} (${r.seqLen} tones)</span>
      <span style="color:${r.correct?'#00C060':'var(--crimson)'}">${r.correct?'✓ SYNCED':'✗ LOST'}</span>
    </div>`).join('')}
    <br>
    <p>Aether Vault — where every frequency matters and every beat is sovereign.</p>
    <button class="btn" onclick="startGame()">[ RUN AGAIN ]</button>
    <button class="btn btn-crimson" onclick="window.history.back()">[ ← RETURN TO GRID ]</button></div>`;
}

render();
</script>
</body>
</html>
