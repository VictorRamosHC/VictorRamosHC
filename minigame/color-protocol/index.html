<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Protocol // Prisma Grid</title>
  <style>
    :root{--bg:#030305;--panel:#0A0B10;--amber:#D4AF37;--ivory:#F5F0E8;--crimson:#8C1D18;--muted:#64748B;--text:#E0E7FF;--border:#1E293B;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Consolas','Space Mono',monospace;}
    body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
    h1{color:var(--amber);font-size:1.4rem;letter-spacing:4px;text-align:center;margin-bottom:4px;}
    .subtitle{color:var(--muted);font-size:0.75rem;letter-spacing:3px;text-align:center;margin-bottom:20px;}
    .game-box{border:1px solid var(--amber);background:var(--panel);padding:24px;max-width:700px;width:100%;}
    .hud{display:flex;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);font-size:0.8rem;}
    .hud span{color:var(--muted);}
    .hud strong{color:var(--amber);}
    .colors-row{display:flex;gap:20px;margin-bottom:24px;align-items:flex-start;flex-wrap:wrap;}
    .swatch-box{flex:1;min-width:180px;}
    .swatch-label{font-size:0.7rem;color:var(--muted);letter-spacing:2px;margin-bottom:8px;}
    .swatch{width:100%;height:120px;border:1px solid var(--border);}
    .controls{flex:2;min-width:260px;}
    .slider-row{margin-bottom:12px;}
    .slider-row label{display:flex;justify-content:space-between;font-size:0.75rem;margin-bottom:4px;}
    .slider-row label span{color:var(--amber);}
    input[type=range]{width:100%;-webkit-appearance:none;height:4px;background:var(--border);outline:none;cursor:pointer;}
    input[type=range].r::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:0;background:#CC3333;cursor:pointer;}
    input[type=range].g::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:0;background:#33CC33;cursor:pointer;}
    input[type=range].b::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:0;background:#3355CC;cursor:pointer;}
    .hex-display{font-size:0.9rem;color:var(--amber);margin-bottom:8px;letter-spacing:2px;}
    .score-display{font-size:0.85rem;margin-bottom:4px;}
    .score-display .good{color:#00C060;}
    .score-display .bad{color:var(--crimson);}
    .btn{background:transparent;border:1px solid var(--amber);color:var(--amber);padding:8px 20px;cursor:pointer;font-family:inherit;font-size:0.85rem;letter-spacing:2px;transition:all 0.2s;margin:4px;}
    .btn:hover{background:var(--amber);color:var(--bg);}
    .btn-crimson{border-color:var(--crimson);color:var(--crimson);}
    .btn-crimson:hover{background:var(--crimson);color:var(--ivory);}
    .progress{display:flex;gap:8px;margin-bottom:16px;}
    .round-pip{width:14px;height:14px;border:1px solid var(--border);background:var(--bg);}
    .round-pip.done{background:var(--amber);}
    .round-pip.active{border-color:var(--amber);}
    .result-row{margin-bottom:6px;font-size:0.8rem;display:flex;justify-content:space-between;}
    .screen{text-align:center;padding:40px 20px;}
    .screen h2{color:var(--amber);font-size:1.6rem;letter-spacing:3px;margin-bottom:12px;}
    .screen p{color:var(--muted);font-size:0.85rem;line-height:1.7;margin-bottom:20px;}
    .score-big{font-size:3rem;color:var(--amber);margin:16px 0;}
    .instructions{background:#06070e;border:1px solid var(--border);padding:12px 16px;margin-bottom:20px;font-size:0.8rem;color:var(--muted);line-height:1.7;}
    .instructions strong{color:var(--ivory);}
    .msg{text-align:center;font-size:0.85rem;min-height:22px;margin-top:12px;}
  </style>
</head>
<body>
<div class="game-box" id="app"></div>
<script>
const TARGETS = [
  {r:212, g:140, b:100},
  {r:180, g:50,  b:60},
  {r:100, g:160, b:200},
  {r:50,  g:120, b:80},
  {r:160, g:100, b:180},
];

let phase='title', round=0, totalScore=0, roundScores=[];
let rVal=128, gVal=128, bVal=128;

function app(){return document.getElementById('app');}
function toHex(v){return v.toString(16).padStart(2,'0').toUpperCase();}
function hexStr(r,g,b){return `#${toHex(r)}${toHex(g)}${toHex(b)}`;}

function calcScore(target,r,g,b){
  const dist=(Math.abs(target.r-r)+Math.abs(target.g-g)+Math.abs(target.b-b))/3;
  return Math.max(0,Math.round(100-dist));
}

function render(){
  if(phase==='title') renderTitle();
  else if(phase==='game') renderGame();
  else if(phase==='end') renderEnd();
}

function renderTitle(){
  app().innerHTML=`<div class="screen">
    <h2>◼ COLOR PROTOCOL</h2>
    <p style="color:var(--amber);font-size:0.7rem;letter-spacing:3px;margin-bottom:16px">PRISMA COMPOSITION GRID // LINKED TO: PRISMA HOUSE PAINTER</p>
    <div class="instructions">
      <strong>MISSION:</strong> Match the target color using the RGB sliders.<br>
      <strong>SCORING:</strong> Score = 100 minus average channel distance. 5 rounds total.<br>
      <strong>GOAL:</strong> Achieve a perfect match (100) on each round.
    </div>
    <button class="btn" onclick="startGame()">[ ENTER PRISMA GRID → ]</button></div>`;
}

function startGame(){phase='game';round=0;totalScore=0;roundScores=[];nextRound();}

function nextRound(){
  rVal=128;gVal=128;bVal=128;
  updateGame();
}

function updateGame(){
  const target=TARGETS[round];
  const myColor=hexStr(rVal,gVal,bVal);
  const targetColor=hexStr(target.r,target.g,target.b);
  const liveScore=calcScore(target,rVal,gVal,bVal);

  app().innerHTML=`
    <h1>COLOR PROTOCOL</h1>
    <div class="subtitle">PRISMA COMPOSITION GRID</div>
    <div class="hud">
      <span>ROUND <strong>${round+1}/5</strong></span>
      <span>TOTAL SCORE <strong>${totalScore}</strong></span>
      <span>LIVE MATCH <strong style="color:${liveScore>=80?'#00C060':liveScore>=50?'var(--amber)':'var(--crimson)'}">${liveScore}%</strong></span>
    </div>
    <div class="progress">${TARGETS.map((_,i)=>`<div class="round-pip ${i<round?'done':i===round?'active':''}"></div>`).join('')}</div>
    <div class="colors-row">
      <div class="swatch-box">
        <div class="swatch-label">◆ TARGET COLOR</div>
        <div class="swatch" style="background:${targetColor}"></div>
        <div style="font-size:0.7rem;color:var(--muted);margin-top:4px;text-align:center">${targetColor}</div>
      </div>
      <div class="swatch-box">
        <div class="swatch-label">◆ YOUR MIX</div>
        <div class="swatch" style="background:${myColor}" id="myColor"></div>
        <div class="hex-display" style="text-align:center;margin-top:4px" id="hexOut">${myColor}</div>
      </div>
      <div class="controls">
        <div class="slider-row">
          <label>RED <span id="rOut">${rVal}</span></label>
          <input type="range" class="r" min="0" max="255" value="${rVal}" id="slR" oninput="rVal=+this.value;liveUpdate()">
        </div>
        <div class="slider-row">
          <label>GREEN <span id="gOut">${gVal}</span></label>
          <input type="range" class="g" min="0" max="255" value="${gVal}" id="slG" oninput="gVal=+this.value;liveUpdate()">
        </div>
        <div class="slider-row">
          <label>BLUE <span id="bOut">${bVal}</span></label>
          <input type="range" class="b" min="0" max="255" value="${bVal}" id="slB" oninput="bVal=+this.value;liveUpdate()">
        </div>
        <button class="btn" onclick="submitColor()" style="margin-top:8px;width:100%">[ LOCK IN COLOR ]</button>
      </div>
    </div>
    <div class="msg" id="msg"></div>`;
}

function liveUpdate(){
  const target=TARGETS[round];
  const myColor=hexStr(rVal,gVal,bVal);
  const s=document.getElementById('myColor');
  const hx=document.getElementById('hexOut');
  const rO=document.getElementById('rOut');
  const gO=document.getElementById('gOut');
  const bO=document.getElementById('bOut');
  if(s)s.style.background=myColor;
  if(hx)hx.textContent=myColor;
  if(rO)rO.textContent=rVal;
  if(gO)gO.textContent=gVal;
  if(bO)bO.textContent=bVal;
  const hud=document.querySelector('.hud strong:last-child');
  const sc=calcScore(target,rVal,gVal,bVal);
  if(hud){hud.textContent=sc+'%';hud.style.color=sc>=80?'#00C060':sc>=50?'var(--amber)':'var(--crimson)';}
}

function submitColor(){
  const target=TARGETS[round];
  const sc=calcScore(target,rVal,gVal,bVal);
  totalScore+=sc;
  roundScores.push({round:round+1,score:sc,target:hexStr(target.r,target.g,target.b),mine:hexStr(rVal,gVal,bVal)});
  const msg=document.getElementById('msg');
  if(msg){
    msg.textContent=`ROUND ${round+1} — Score: ${sc}/100`;
    msg.style.color=sc>=80?'#00C060':sc>=50?'var(--amber)':'var(--crimson)';
  }
  round++;
  setTimeout(()=>{
    if(round<5){nextRound();}
    else{phase='end';render();}
  },900);
}

function renderEnd(){
  const avg=Math.round(totalScore/5);
  const grade=avg>=90?'MASTER COLORIST':avg>=70?'PRISMA ARCHITECT':avg>=50?'PALETTE ENGINEER':'COLOR TRAINEE';
  app().innerHTML=`<div class="screen">
    <h2>◼ PROTOCOL COMPLETE</h2>
    <div class="score-big">${totalScore}<span style="font-size:1rem;color:var(--muted)">/500</span></div>
    <p>AVERAGE MATCH: <strong style="color:var(--amber)">${avg}%</strong> — RANK: <strong style="color:var(--amber)">${grade}</strong></p>
    ${roundScores.map(rs=>`<div class="result-row"><span>Round ${rs.round}</span><span style="display:flex;gap:12px;align-items:center"><span style="display:inline-block;width:18px;height:18px;background:${rs.target};border:1px solid #333"></span> → <span style="display:inline-block;width:18px;height:18px;background:${rs.mine};border:1px solid #333"></span></span><span style="color:${rs.score>=80?'#00C060':rs.score>=50?'var(--amber)':'var(--crimson)'}">${rs.score}%</span></div>`).join('')}
    <br>
    <button class="btn" onclick="startGame()">[ RUN AGAIN ]</button>
    <button class="btn btn-crimson" onclick="window.history.back()">[ ← RETURN TO GRID ]</button></div>`;
}

render();
</script>
</body>
</html>
